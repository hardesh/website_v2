name: Sync bookshelf from Hardcover

on:
  schedule:
    - cron: '17 3 * * 1' # weekly, Mondays 03:17 UTC (08:47 IST)
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the deploy workflow (pushes made with GITHUB_TOKEN don't trigger it on their own)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Pull the Hardcover library into data/books.json
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
        run: node scripts/sync-hardcover.mjs
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/books.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No bookshelf changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/books.json
            git commit -m "Sync bookshelf from Hardcover"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }} # passed via env, never interpolated into the shell command
        run: gh workflow run deploy.yml --ref "$REF"
