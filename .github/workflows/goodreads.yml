name: Sync Goodreads bookshelf

on:
  schedule:
    - cron: '17 3 * * *' # nightly, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the deploy workflow (pushes made with GITHUB_TOKEN don't trigger it on their own)

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pull shelves into data/books.json
        env:
          GOODREADS_USER_ID: ${{ vars.GOODREADS_USER_ID || secrets.GOODREADS_USER_ID }}
        run: node scripts/sync-goodreads.mjs
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/books.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No bookshelf changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/books.json
            git commit -m "Sync Goodreads bookshelf"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Rebuild the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"
